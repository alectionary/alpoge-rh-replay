name: Bounded source proof benchmark
run-name: Bounded proof benchmark ${{ inputs.expected_helper_commit }}

on:
  workflow_dispatch:
    inputs:
      expected_helper_commit:
        description: Exact independently reviewed helper commit H
        required: true
        type: string
      expected_config_sha256:
        description: SHA256 of the reviewed bound benchmark/config.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bounded-proof-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-source-proof-benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'alectionary' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HELPER_COMMIT: ${{ inputs.expected_helper_commit }}
      EXPECTED_CONFIG_SHA256: ${{ inputs.expected_config_sha256 }}
      ELAN_TOOLCHAIN: leanprover/lean4:v4.36.0
    steps:
      - name: Reserve time for diagnostic upload
        run: |
          python3 - <<'PY'
          import os, time
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('BENCH_JOB_START_EPOCH=' + str(time.time()) + '\n')
          PY
      - name: Checkout only the reviewed benchmark helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: benchmark
          fetch-depth: 1
      - name: Reject unbound or changed inputs before setup
        run: |
          python3 - <<'PY'
          import os, re
          helper = os.environ['EXPECTED_HELPER_COMMIT']
          config = os.environ['EXPECTED_CONFIG_SHA256']
          assert re.fullmatch('[0-9a-f]{40}', helper) and helper == os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{64}', config)
          print('[BENCH_HELPER] ' + helper)
          print('[BENCH_CONFIG_SHA256] ' + config)
          PY
          python3 benchmark/benchmark.py validate --config benchmark/config.json --config-sha256 "$EXPECTED_CONFIG_SHA256"
      - name: Install stock toolchain and measurement tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y elan bubblewrap time
          elan toolchain install leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run bounded union warm-up and ABBAAB comparison
        run: |
          python3 benchmark/benchmark.py run --config benchmark/config.json --config-sha256 "$EXPECTED_CONFIG_SHA256" \
            --workspace "$RUNNER_TEMP/bounded-benchmark-workspace" --output "$RUNNER_TEMP/bounded-benchmark-output"
      - name: Retain actual diagnostics, including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-proof-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bounded-benchmark-output
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
