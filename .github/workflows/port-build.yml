name: Port build check
run-name: Semantic audit ${{ inputs.source_commit }}
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact contribution commit to build and audit
        required: true
        type: string
      patch_ids:
        description: Space-separated module IDs
        required: true
        type: string
permissions:
  contents: read
env:
  AUDIT_SOURCE_COMMIT: ${{ inputs.source_commit }}
  PATCH_IDS: ${{ inputs.patch_ids }}
  AUDIT_POLICY_COMMIT: 3e956370a34018cb518084553ad90befaa8eed1c
  AUDIT_SCRIPT_SHA256: f94052a41bdca049b3e91c9077ccf940b0cc5fe36b3e2767f78a64567ac5aae7
  REUSED_AUDIT_SCRIPT_SHA256: 2e72631b47fccd5b8f7f41f17c634e708566e96f17d8ebc53c86f592745ab5d1
jobs:
  semantic-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alectionary/alpoge-rh-replay
          ref: ${{ inputs.source_commit }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rohanarun/alpoge-rh-replay
          ref: ${{ env.AUDIT_POLICY_COMMIT }}
          path: policy
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source, policy, pins and module manifest
        working-directory: source
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, os, re, subprocess
          from pathlib import Path
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["AUDIT_SOURCE_COMMIT"])
          assert actual == os.environ["AUDIT_SOURCE_COMMIT"]
          policy = Path("../policy").resolve()
          policy_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=policy, text=True).strip()
          assert policy_sha == os.environ["AUDIT_POLICY_COMMIT"]
          script_sha = hashlib.sha256((policy / "port/islattice_audit.lean").read_bytes()).hexdigest()
          assert script_sha == os.environ["AUDIT_SCRIPT_SHA256"]
          reused_sha = hashlib.sha256((policy / "port/reused_audit.lean").read_bytes()).hexdigest()
          assert reused_sha == os.environ["REUSED_AUDIT_SCRIPT_SHA256"]
          pins = json.loads(Path("port/target.json").read_text())
          assert pins["lean"] == "leanprover/lean4:v4.36.0"
          assert pins["mathlib"] == "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"
          ids = os.environ["PATCH_IDS"].split()
          assert ids and all(re.fullmatch(r"M[0-9]{6}", mid) for mid in ids)
          rows = {r["id"]: r for r in map(json.loads, gzip.open("tracker/modules.jsonl.gz", "rt"))}
          closure = set()
          def include(mid):
              if mid in closure:
                  return
              assert Path("port/patches", mid + ".json").is_file(), mid
              closure.add(mid)
              for dependency in rows[mid]["imports"]:
                  include(dependency)
          for mid in ids:
              include(mid)
          manifest = [{"id": mid, "module": rows[mid]["module"]} for mid in sorted(closure)]
          (Path(os.environ["RUNNER_TEMP"]) / "port-semantic-manifest.json").write_text(json.dumps(manifest))
          print("[AUDIT_SOURCE]", actual, flush=True)
          print("[AUDIT_POLICY]", policy_sha, flush=True)
          print("[AUDIT_SCRIPT_SHA256]", script_sha, flush=True)
          print("[REUSED_AUDIT_SCRIPT_SHA256]", reused_sha, flush=True)
          for row in manifest:
              print("[AUDIT_MODULE]", row["id"], row["module"], flush=True)
          PY
      - name: Free disk space for Mathlib and Lean
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Install the pinned Lean toolchain
        working-directory: source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y elan
          elan toolchain install leanprover/lean4:v4.36.0
          elan default leanprover/lean4:v4.36.0
          lean --version
          lake --version
      - name: Build the exact contribution and verified project imports
        working-directory: source
        run: |
          read -r -a ids <<< "$PATCH_IDS"
          python3 scripts/port-ci-build.py \
            --workspace "$RUNNER_TEMP/port-semantic-workspace" \
            --setup-lake \
            --patch-ids "${ids[@]}"
      - name: Audit elaborated types, definitions and opaque bodies with both policy scripts
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ["RUNNER_TEMP"]) / "port-semantic-workspace"
          policy = Path(os.environ["GITHUB_WORKSPACE"]) / "policy"
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "port-semantic-manifest.json").read_text())
          auditors = [
              ("islattice", policy / "port/islattice_audit.lean", "AUDIT_SCRIPT_SHA256"),
              ("reused", policy / "port/reused_audit.lean", "REUSED_AUDIT_SCRIPT_SHA256"),
          ]
          for kind, auditor, digest_env in auditors:
              assert hashlib.sha256(auditor.read_bytes()).hexdigest() == os.environ[digest_env]
          failures = []
          for row in manifest:
              obj = workspace / (".lake/build/lib/lean/" + row["module"].replace(".", "/") + ".olean")
              assert obj.is_file(), obj
              print("[AUDIT_OBJECT]", row["id"], hashlib.sha256(obj.read_bytes()).hexdigest(), flush=True)
              for kind, auditor, _ in auditors:
                  print("[AUDIT_BEGIN]", kind, row["id"], row["module"], flush=True)
                  result = subprocess.run(["lake", "env", "lean", "--run", str(auditor), row["module"]],
                                          cwd=workspace)
                  print("[AUDIT_END]", kind, row["id"], result.returncode, flush=True)
                  if result.returncode != 0:
                      failures.append((kind, row["id"], result.returncode))
          if failures:
              raise SystemExit("SEMANTIC_AUDITS_FAILED " + repr(failures))
          print("ISLATTICE_AUDIT_PASSED all", len(manifest), "module(s).", flush=True)
          print("REUSED_AUDIT_PASSED all", len(manifest), "module(s).", flush=True)
          print("SEMANTIC_AUDITS_PASSED all", len(manifest), "module(s), both auditors.", flush=True)
          PY
